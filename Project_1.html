<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Project1</title>
		<script>
		const ISOK = 200;
			var request = new XMLHttpRequest();
			
			function retrieveMLBData(url) {
				request.onload = function() {
					if (request.status === ISOK) {
						document.getElementById("Msg").innerHTML = request.responseText;
						var jsObject = JSON.parse(request.responseText);
					}
				}
				
				request.open("GET", url, true);
				request.send();
			}
			
			




			function startMeUp() {
				document.getElementById("Msg").innerHTML = "";
			}

			function nextGame() {
				document.getElementById("Msg").innerHTML = "Next game for this date";
			}

			function previousGame() {
				document.getElementById("Msg").innerHTML = "Previous game for this date";
			}

			function nextHighlight() {
				document.getElementById("Msg2").innerHTML = "Next highlight for this date";
			}

			function previousHighlight() {
				document.getElementById("Msg2").innerHTML = "Previous highlight for this date";
			}

			function retrieveData() {
				document.getElementById("Msg2").innerHTML = "Running playback for this date";
				let year = document.getElementById("year").value;
				let month = document.getElementById("Month").value;
				let day = document.getElementById("Day").value;


				var url = "http://statsapi.mlb.com/api/v1/schedule/games/?sportId=1&startDate=" + year + "-" + month + "-" + day + "&endDate=" + year + "-" + month + "-" + day;
				
				retrieveMLBData(url);
			}
		</script>
<style>

</style>

	</head>

	<body onload="startMeUp();">

		<div id="Main">
			<div id="Section1">

				
				<form id="UserInfoForm">
						<label for="From/To Date">From / To Date</label> <br>
						<label for="year">Year</label>
					<input placeholder="use combo box here" class="combobox" id="year" type="text"><br>

				</form>
						<input value="Retrieve MLB Data for this Date" id="RP_btn" type="button" onclick="retrieveData();"><br>

				<form id="TeamInfoForm">
					<label for="HT_name">Home Team Name</label>

					<input value="Next Game for this date" id="NG_btn" type="button" onclick="nextGame();">
					<input value="Previous Game for this date" id="PG_btn" type="button" onclick="previousGame();"><br>
				</form>

				<form id="HighlightForm">

					<input placeholder="Use text box or div" id="H_playbacks" type="text"><br>

					<input value="Next Highlight for this date" id="NH_btn" type="button" onclick="nextHighlight();">
					<input value="Previous Highlight for this date" id="PH_btn" type="button" onclick="previousHighlight();"><br>
					<input value="Run Playback for this date" id="RP_btn" type="button" onclick="runPlayback();"><br>
