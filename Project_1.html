<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Project1</title>
    <script>
      const ISOK = 200;
      var request = new XMLHttpRequest();
      var jsObjectGame = "";
      var jsObjectHighlight = "";
      var gameIndex = 0;
      async function retrieveMLBData(url, type) {
        return new Promise((resolve) => {
          request.onload = () => {
            if (request.status === ISOK) {
              if (type === "G") {
                jsObjectGame = JSON.parse(request.responseText);
              } else {
                jsObjectHighlight = JSON.parse(request.responseText);
              }
              resolve();
            }
          };
          request.open("GET", url, true);
          request.send();
        });
      }

      function startMeUp() {
        document.getElementById("Msg").innerHTML = "";
      }

      // Show the home and away team names for the game at gameIndex. After the
      // names are filled in, it also asks the MLB site for that game's highlights
      // using the game's gamePk, so the highlights match the game on screen
      async function showGame() {
        let games = jsObjectGame.dates[0].games;
        document.getElementById("HT_name").value =
          games[gameIndex].teams.home.team.name;
        document.getElementById("AT_name").value =
          games[gameIndex].teams.away.team.name;
        await getHighlight(games[gameIndex].gamePk);
      }

      function nextGame() {
        // Move forward only if there is a next game. totalGames - 1 is the index
        // of the last game, so we stop there. If no data is loaded yet, totalGames
        // is undefined and the check fails, so nothing happens and nothing breaks
        if (gameIndex < jsObjectGame.totalGames - 1) {
          gameIndex++;
          showGame();
        }
      }

      function previousGame() {
        // Move back only if there is a previous game. Index 0 is the first game,
        // so we stop there. gameIndex also starts at 0, which means this button
        // does nothing until a date has been retrieved and the user has moved on
        if (gameIndex > 0) {
          gameIndex--;
          showGame();
        }
      }

      function nextHighlight() {
        document.getElementById("Msg2").innerHTML =
          "Next highlight for this date";
      }

      function previousHighlight() {
        document.getElementById("Msg2").innerHTML =
          "Previous highlight for this date";
      }

      async function retrieveData() {
        document.getElementById("Msg2").innerHTML =
          "Running playback for this date";
        let year = document.getElementById("year").value;
        let month = document.getElementById("Month").value;
        let day = document.getElementById("Day").value;

        var url =
          "http://statsapi.mlb.com/api/v1/schedule/games/?sportId=1&startDate=" +
          year +
          "-" +
          month +
          "-" +
          day +
          "&endDate=" +
          year +
          "-" +
          month +
          "-" +
          day;

        await retrieveMLBData(url, "G");
        console.log(jsObjectGame.dates);

        // Start at the first game of the selected date. The index is reset every
        // time new data comes in, so a new date never keeps the old position. The
        // length check is there because a day with no games can return an empty
        // dates array, and showGame would fail on it
        gameIndex = 0;
        if (jsObjectGame.dates.length > 0) {
          showGame();
        }
      }
      async function getHighlight(idGame) {
        var url = "https://statsapi.mlb.com/api/v1/game/" + idGame + "/content";
        await retrieveMLBData(url, "H");
        console.log(jsObjectHighlight.highlights.highlights);
        jsObjectHighlight.highlights.highlights.items.forEach((element) => {
          document.getElementById("H_playbacks").value = element.headline;
        });
      }
    </script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #0b1f3a;
        margin: 0;
        padding: 30px 15px;
        display: flex;
        justify-content: center;
      }

      #Main {
        width: 100%;
        max-width: 600px;
      }

      #Main::before {
        content: "\26BE MLB Highlight Forum";
        display: block;
        text-align: center;
        color: white;
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 20px;
      }

      #Section1,
      #HighlightForm {
        background-color: white;
        padding: 20px;
        border-radius: 12px;
        border-top: 6px solid #c8102e;
      }

      #HighlightForm {
        margin-top: 20px;
        border-top-color: #16365f;
      }

      br {
        display: none;
      }

      label {
        display: block;
        font-weight: bold;
        font-size: 13px;
        color: #6b7a8c;
        margin: 12px 0 5px;
      }

      input[type="text"] {
        width: 100%;
        padding: 10px;
        font-size: 15px;
        background-color: #eef5ff;
        border: 2px solid #d6dde6;
        border-radius: 8px;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: #16365f;
      }

      input[type="button"] {
        width: 49%;
        margin-top: 15px;
        padding: 12px;
        font-weight: bold;
        color: #0b1f3a;
        background-color: #eef2f7;
        border: 2px solid #d6dde6;
        border-radius: 8px;
        cursor: pointer;
      }

      input[type="button"]:hover {
        background-color: #dde5ee;
      }

      #RP_btn {
        width: 100%;
        color: white;
        background-color: #c8102e;
        border-color: #c8102e;
      }

      #HighlightForm #RP_btn {
        background-color: #1f8a4c;
        border-color: #1f8a4c;
      }

      #Msg,
      #Msg2 {
        text-align: center;
        font-weight: normal;
      }
    </style>
  </head>

  <body onload="startMeUp()">
    <div id="Main">
      <div id="Section1">
        <form id="UserInfoForm">
          <label for="From/To Date">From / To Date</label> <br />
          <label for="year">Year</label>
          <input
            placeholder="use combo box here"
            class="combobox"
            id="year"
            type="text" /><br />
          <label for="Month">Month</label>
          <input
            placeholder="use combo box here"
            class="combobox"
            id="Month"
            type="text" /><br />
          <label for="Day">Day</label>
          <input
            placeholder="use combo box here"
            class="combobox"
            id="Day"
            type="text" /><br />
        </form>
        <input
          value="Retrieve MLB Data for this Date"
          id="RP_btn"
          type="button"
          onclick="retrieveData()" /><br />

        <form id="TeamInfoForm">
          <label for="HT_name">Home Team Name</label>
          <input
            placeholder="Use text box or div"
            id="HT_name"
            type="text" /><br />

          <label for="AT_name">Away Team Name</label>
          <input
            placeholder="Use text box or div"
            id="AT_name"
            type="text" /><br />

          <input
            value="Next Game for this date"
            id="NG_btn"
            type="button"
            onclick="nextGame()" />
          <input
            value="Previous Game for this date"
            id="PG_btn"
            type="button"
            onclick="previousGame()" /><br />
        </form>
      </div>

      <form id="HighlightForm">
        <label for="H_playbacks">Highlight Playbacks</label>
        <input
          placeholder="Use text box or div"
          id="H_playbacks"
          type="text" /><br />

        <input
          value="Next Highlight for this date"
          id="NH_btn"
          type="button"
          onclick="nextHighlight()" />
        <input
          value="Previous Highlight for this date"
          id="PH_btn"
          type="button"
          onclick="previousHighlight()" /><br />
        <input
          value="Run Playback for this date"
          id="RP_btn"
          type="button"
          onclick="runPlayback()" /><br />

        <label id="Msg"> </label><br />
        <label id="Msg2"> </label><br />
      </form>
    </div>
  </body>
</html>
