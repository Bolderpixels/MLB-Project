<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Project1</title>
    <script>
      const ISOK = 200;
      var request = new XMLHttpRequest();
      var jsObjectGame = "";
      var jsObjectHighlight = "";
      var gameIndex = 0;
      var highlightIndex = 0;
      var itemsUrlsVideos = [];
      async function retrieveMLBData(url, type) {
        return new Promise((resolve) => {
          request.onload = () => {
            if (request.status === ISOK) {
              if (type === "G") {
                jsObjectGame = JSON.parse(request.responseText);
              } else {
                jsObjectHighlight = JSON.parse(request.responseText);
              }
              resolve();
            }
          };
          request.open("GET", url, true);
          request.send();
        });
      }

      // function startMeUp() {
      //   document.getElementById("Msg").innerHTML = "";
      // }

      // Fills in the home and away team names for the game we're on (gameIndex).
      // Once the names are in, it grabs that game's highlights using the gamePk,
      // so the highlights always match the game on screen
      async function showGame() {
        let games = jsObjectGame.dates[0].games;
        document.getElementById("HT_name").value =
          games[gameIndex].teams.home.team.name;
        document.getElementById("AT_name").value =
          games[gameIndex].teams.away.team.name;
        await getHighlight(games[gameIndex].gamePk);
      }

      function nextGame() {
        // Only go forward if there's a game after this one. totalGames - 1 is
        // the last index, so that's where we stop. If nothing is loaded yet,
        // totalGames is undefined, the check is false and the click does nothing
        if (gameIndex < jsObjectGame.totalGames - 1) {
          gameIndex++;
          showGame();
        }
      }

      function previousGame() {
        // Only go back if we're past the first game (index 0). gameIndex starts
        // at 0 as well, so this button does nothing until a date is loaded and
        // Next Game has been clicked at least once
        if (gameIndex > 0) {
          gameIndex--;
          showGame();
        }
      }

      // Gets the highlights list for the current game. If nothing is loaded yet,
      // or the game has no highlights, it gives back an empty list so the code
      // that uses it doesn't crash
      function getHighlightItems() {
        return jsObjectHighlight.highlights?.highlights?.items || [];
      }

      function showHighlight() {
        let items = getHighlightItems();

        if (items.length === 0) {
          document.getElementById("H_playbacks").value =
            "No highlights available";
          return;
        }
        document.getElementById("H_playbacks").value =
          items[highlightIndex].headline;
      }

      function nextHighlight() {
        // Same idea as nextGame. The last valid index is length - 1, and if the
        // game has no highlights the length is 0, so nothing happens
        if (highlightIndex < getHighlightItems().length - 1) {
          highlightIndex++;
          showHighlight();
        }
      }

      function previousHighlight() {
        if (highlightIndex > 0) {
          highlightIndex--;
          showHighlight();
        }
      }

      async function retrieveData() {
        document.getElementById("Msg2").innerHTML =
          "Running playback for this date";
        let year = document.getElementById("year").value;
        let month = document.getElementById("Month").value;
        let day = document.getElementById("Day").value;

        var url =
          "http://statsapi.mlb.com/api/v1/schedule/games/?sportId=1&startDate=" +
          year +
          "-" +
          month +
          "-" +
          day +
          "&endDate=" +
          year +
          "-" +
          month +
          "-" +
          day;

        await retrieveMLBData(url, "G");
        // Start on the first game every time a new date comes in, otherwise we'd
        // keep the position from the last date. A day with no games can come
        // back with an empty dates array, so check the length first or showGame
        // would crash
        gameIndex = 0;
        if (jsObjectGame.dates.length > 0) {
          showGame();
        }
      }
      async function getHighlight(idGame) {
        var url = "https://statsapi.mlb.com/api/v1/game/" + idGame + "/content";
        await retrieveMLBData(url, "H");

        highlightIndex = 0;
        showHighlight();
        itemsUrlsVideos = getHighlightItems()
          .filter((x) => x.playbacks[0].name === "mp4Avc")
          .map((x) => x.playbacks[0].url);
        console.log(itemsUrlsVideos);
      }
      function runPlayback() {
        var newWin = {};
        itemsUrlsVideos.forEach((x, index) => {
          if (index === 0) {
            newWin = window.open(x, "_blank");
          } else {
            newWin.location.href = x;
          }
          if (newWin) {
            newWin.focus();
          }
        });
      }
    </script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Consolas, Menlo, "Courier New", monospace;
        background-color: #f5f5f5;
        color: #111111;
        margin: 0;
        padding: 40px 15px;
        display: flex;
        justify-content: center;
      }

      #Main {
        width: 100%;
        max-width: 640px;
      }

      #Main::before {
        content: "MLB Highlight Forum";
        display: block;
        font-size: 20px;
        font-weight: bold;
        margin: 0 0 14px 10px;
      }

      #Section1,
      #HighlightForm {
        background-color: white;
        padding: 24px;
        border: 1px solid #e8e8ea;
        border-radius: 28px;
      }

      #HighlightForm {
        margin-top: 16px;
        background-color: #fff7f2;
        border-color: #fbe0d0;
      }

      br {
        display: none;
      }

      #TeamInfoForm,
      #HighlightForm {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
      }

      #PG_btn,
      #PH_btn {
        order: 1;
      }

      #NG_btn,
      #NH_btn {
        order: 2;
      }

      #HighlightForm #RP_btn {
        order: 3;
      }

      #Msg {
        order: 4;
      }

      #Msg2 {
        order: 5;
      }

      label {
        display: block;
        width: 100%;
        font-size: 13px;
        color: #6b6f85;
        margin: 14px 0 6px 4px;
      }

      #HighlightForm label[for="H_playbacks"] {
        color: #e8590c;
        font-weight: bold;
        margin-top: 0;
      }

      input[type="text"] {
        width: 100%;
        padding: 14px;
        font-family: inherit;
        font-size: 14px;
        background-color: #f9f9fa;
        border: 1px solid #e8e8ea;
        border-radius: 14px;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: #e8590c;
      }

      input[type="button"] {
        width: 49%;
        margin-top: 14px;
        padding: 14px 6px;
        font-family: inherit;
        font-size: 13px;
        color: #e8590c;
        background-color: #fcfcfc;
        border: 1px dashed #d0d0d4;
        border-radius: 14px;
        cursor: pointer;
      }

      input[type="button"]:hover {
        background-color: #fff2ea;
        border-color: #e8590c;
      }

      #RP_btn {
        width: 100%;
        margin-top: 20px;
        font-weight: bold;
        color: white;
        background-color: #f05a00;
        border: none;
        border-radius: 999px;
      }

      #RP_btn:hover {
        background-color: #d94f00;
      }

      #Msg,
      #Msg2 {
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div id="Main">
      <div id="Section1">
        <form id="UserInfoForm">
          <label for="From/To Date">From / To Date</label> <br />
          <label for="year">Year</label>
          <input
            placeholder="use combo box here"
            class="combobox"
            id="year"
            type="text" /><br />
          <label for="Month">Month</label>
          <input
            placeholder="use combo box here"
            class="combobox"
            id="Month"
            type="text" /><br />
          <label for="Day">Day</label>
          <input
            placeholder="use combo box here"
            class="combobox"
            id="Day"
            type="text" /><br />
        </form>
        <input
          value="Retrieve MLB Data for this Date"
          id="RP_btn"
          type="button"
          onclick="retrieveData()" /><br />

        <form id="TeamInfoForm">
          <label for="HT_name">Home Team Name</label>
          <input
            placeholder="Use text box or div"
            id="HT_name"
            type="text" /><br />

          <label for="AT_name">Away Team Name</label>
          <input
            placeholder="Use text box or div"
            id="AT_name"
            type="text" /><br />

          <input
            value="Next Game for this date"
            id="NG_btn"
            type="button"
            onclick="nextGame()" />
          <input
            value="Previous Game for this date"
            id="PG_btn"
            type="button"
            onclick="previousGame()" /><br />
        </form>
      </div>

      <form id="HighlightForm">
        <label for="H_playbacks">Highlight Playbacks</label>
        <input
          placeholder="Use text box or div"
          id="H_playbacks"
          type="text" /><br />

        <input
          value="Next Highlight for this date"
          id="NH_btn"
          type="button"
          onclick="nextHighlight()" />
        <input
          value="Previous Highlight for this date"
          id="PH_btn"
          type="button"
          onclick="previousHighlight()" /><br />
        <input
          value="Run Playback for this date"
          id="RP_btn"
          type="button"
          onclick="runPlayback()" /><br />

        <label id="Msg"> </label><br />
        <label id="Msg2"> </label><br />
      </form>
    </div>
  </body>
</html>
